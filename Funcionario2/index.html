<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Funcionario</title>
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">        <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container shadow mt-5 mb-5">
        <div class="card-box shadow mb-4 p-3 paba">
            <strong><h1 class="text-center titulo">Cadastrar | Funcionario</h1></strong>
        </div>
        <div class="card-box shadow p-3 menor">
            <h1 class="mb-3">Cadastro</h1>
            <div class="row p-3">
                <label>Nome Completo:</label>
                <input type="text" placeholder="Digite seu Nome" class="mb-3 p-2">
                <label>E-mail:</label>
                <input type="email" placeholder="exemplo@email.com" class="mb-3 p-2">
                <label>Senha:</label>
                <input type="password" placeholder="Digite sua Senha" class="mb-3 p-2">
                <label>Função:</label>
                <input type="text" placeholder="Informe sua Função" class="mb-3 p-2">
                <label>Matrícula:</label>
                <input type="text" placeholder="Informe sua Matrícula" class="p-2">
            </div>
        </div>
        <div>
            <a href="../index.html" class="link text-center shadow p-4 mt-4 w-100 by">Cadastrar</a> 
        </div>
    </div>
</body>
</html>
