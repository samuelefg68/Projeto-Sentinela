<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV - Painel de Atendimento</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>
    <main class="painel">
        <section class="lado-esquerdo">

            <div class="card guiche">
                <h2>GUICHÊ</h2>
                <div class="numero">
                    05
                </div>

            </div>

            <div class="card historico">

                <h2>ÚLTIMAS CHAMADAS</h2>

                <div class="chamada p">
                    <span>Guichê 04</span>
                    <strong>Maria Silva</strong>
                </div>

                <div class="chamada c">
                    <span>Guichê 02</span>
                    <strong>João Santos</strong>
                </div>

                <div class="chamada d">
                    <span>Guichê 07</span>
                    <strong>Ana Oliveira</strong>
                </div>
            </div>

        </section>

        <section class="lado-direito">

            <div class="card chamada-atual">

                <h2>ATENDIMENTO</h2>

                <p class="nome">
                    CARLOS EDUARDO
                </p>

                <p class="mensagem">
                    DIRIJA-SE AO GUICHÊ 05
                </p>
            </div>

            <div class="card rodape">

                <p>Sistema de Atendimento</p>

            </div>

        </section>

    </main>

</body>
</html>
