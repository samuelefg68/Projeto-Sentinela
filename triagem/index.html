<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5 mb-3 shadow p-4">

        <div class="card-box shadow p-3 titulo">
            <h1 class="text-center"><strong>Triagem</strong></h1>
        </div>

        <div class="card-box shadow mt-4 p-4 paba">
            <h2 class="tp">Campos Obrigatórios</h2>
            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Estado Mental: </label>
                    <input type="text" class="form-control" placeholder="Alerta, orientado, confuso...">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Nervos Cranianos: </label>
                    <input type="text" class="form-control" placeholder="Sem alterações, paralisia facial...">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Motricidade e Coordenação: </label>
                    <input type="text" class="form-control" placeholder="Força preservada, ataxia...">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Sensibilidade: </label>
                    <input type="text" class="form-control" placeholder="Normal, parestesia em MMSS...">
                </div>
            </div> 

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Reflexos: </label>
                    <input type="text" class="form-control" placeholder="Normorreflexos, hiporreflexia...">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Marcha e Equiliíbrio </label>
                    <input type="text" class="form-control" placeholder="Marcha estável, desequilíbrio...">
                </div>
            </div> 
            <div class="row">
                <div class="col-md-12 mb-3 mt-3">
                    <label class="form-label">Sintomas Prinipais</label>
                    <textarea class="form-control" placeholder="Dor de cabeça, vomitos..."></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Classificação de Risco</label>
                    <select class="form-select">
                        <option selected disabled> Selecione a Classifição</option>
                        <option class="bl">Não urgente</option>
                        <option class="gr">Pouco Urgente</option>
                        <option class="yl">Urgente</option>
                        <option class="lr">Muito Urgente</option>
                        <option class="rd">Emergência</option>
                    </select>
                </div>

                <div class="col-md-6  mt-3 mb-3">
                    <label class="form-label">Temperatura</label>
                    <input type="number" class="form-control" placeholder="Ex: 36.5 ºC">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Saturação Baixa</label>
                    <input type="number" class="form-control" placeholder="Ex: 98%">
                </div>
            </div>

            <div class="row">
                <div class="mb-3 mt-4">
                    <a href="../medico/index.html" class="link button w-100 p-4 by">Enviar</a> 
                </div>
            </div>

    </div>
    
</body>
</html>
