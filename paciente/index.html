<head>

<body>
   <div>

        <form>
            <fieldset id="maior">

            <fieldset id="titulo">
                <div><h1>Cadastrar</h1></div>
                <div id="legenda1"><legend><h3>Paciente</h3></legend></div>
            </fieldset>
            
            <fieldset id="paba">
                <legend><h3 id="legenda2">Informações Pessoais</h3></legend>

                <div>
                    <label>Nome Completo:</label> <input type="text" placeholder="Digite seu nome">
                   
                </div>
                <br>
                <div>
                    <label>CPF: </label>  <input type="Number" placeholder="Cpf completo">
                
                </div>
                <br>
                <div>
                    <label>Sexo:</label> <input type="text" placeholder="Informe seu sexo"> 
                </div>
                <br>
                <div>
                    <label>Data de Nascimento:</label>  <input type="date"> 
                </div>
                <br>
                <div>
                    <label>Endereço:</label>  <input type="text" placeholder="Endereço Completo">
                </div>
            </fieldset>
            
            <fieldset id="saba">
                <legend ><h3 id="legenda3">Meios de Contato</h3></legend>

                <div>
                    <label>Telefone:</label> <input type="number" placeholder="Telefone Completo">
                </div>
                <br>
                <div>
                    <label>E-mail:</label> <input type="email" placeholder="Exemplo@email.com">
                </div>
                <br>
                <div>
                    <label>Convênio:</label>  <input type="text" placeholder="Informe seu convênio">
                </div>
                <br>
                <div>
                    <label>Contatos de Emergência:</label> <input type="number" placeholder="Número de Emergência">
                </div>
                <br>
                <a href="../index.html" id="finalizar"><h3  > Finalizar </h3></a>

            </fieldset>
            
            </fieldset>

        </form>
    </div>
