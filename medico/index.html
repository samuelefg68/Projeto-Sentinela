        </div>

        <div class="card-box shadow meir">
            <h3>Prontuário do Paciente</h3>

            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nome:</strong>João da Silva</p>
                    <p><strong>CPF:</strong>000.000.000.-00</p>
                    <p><strong> Data de Nascimento:</strong> 01/01/1990</p>
                </div>
                
                <div class="col-md-6">
                    <p><strong>Sexo:</strong>Masculino</p>
                    <p><strong>Telefone</strong>(61)99999-9999</p>
                    <p><strong>Convênio:</strong> SUS</p>
                </div>
            </div>
        </div>
        <div class="card-box shadow ficha">

            <h3>Registro de Atendimento</h3>

            <div class="campo">
                <label> CRM do Médico:</label>
                <input type="text" placeholder="Digite o CRM">
            </div>
            
            <div class="campo">
                <label> Queixa Principal:</label> 
                <textarea placeholder=" Motivo específico da consulta (ex: cefaleia, tontura, fraqueza, alteração de memória, tremores)."></textarea>
            </div>
            
            <div class="campo">
                <label> Tempo de Evolução:</label> 
                <textarea placeholder=" Há quanto tempo os sintomas começaram."></textarea>
            </div>
            
            <div class="campo">
                <label> Sinais Vitais: </label> 
                <textarea placeholder="Pressão arterial, frequência cardíaca, temperatura."></textarea>
            </div>
            
            <div class="campo">
                <label> Nível de Consciência:</label> 
                <textarea placeholder=" Escala de Coma de Glasgow (se indicado)."></textarea>
            </div> 
            
            
            <div class="campo">
                <label>Histórico da Moléstia Atual (HDA):</label> 
                <textarea placeholder="  Cronologia detalhada dos sintomas."></textarea>
            </div> 

            
            <div class="campo">
                <label>Medicamentos em Uso:</label> 
                <textarea placeholder="  Especial atenção a anticoagulantes, antiepilépticos ou psicoativos."></textarea>
            </div> 

            
            <div class="campo">
                <label>Alergias:</label> 
                <textarea placeholder="  Registro visível de alergia a medicamentos."></textarea>
            </div> 

            
            <div class="campo">
                <label>Histórico Familiar: </label> 
                <textarea placeholder="  Doenças neurológicas na família (Ataxia, Huntington, etc.)."></textarea>
            </div> 

            
            <div class="campo">
                <label>Encaminhamento/Documento de Origem: </label> 
                <textarea placeholder=" Se veio de UBS ou emergência."></textarea>
            </div> 


            <div class="campo">
                <label>Encaminhamento/Documento de Origem: </label> 
                <textarea placeholder=" Se veio de UBS ou emergência."></textarea>
            </div>

            </div>
